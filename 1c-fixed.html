<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МойБизнес — учёт</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--line:#e5e7eb;--text:#202124;--muted:#6b7280;--blue:#2563eb;--blue2:#eaf1ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:var(--text)}
button,input{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:#fff;border-right:1px solid var(--line);padding:18px 12px}.logo{font-size:20px;font-weight:700;padding:10px 12px 22px}.logo span{color:#f59e0b}.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;color:#374151}.nav button.active,.nav button:hover{background:var(--blue2);color:var(--blue)}.main{flex:1;min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top strong{font-size:18px}.user{color:var(--muted)}.content{padding:24px;max-width:1300px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.card small{color:var(--muted)}.card b{display:block;font-size:25px;margin-top:8px}.toolbar{display:flex;gap:10px;margin:18px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f9fafb;color:#6b7280}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:40px;text-align:center;color:var(--muted)}
@media(max-width:800px){.side{width:68px}.logo{font-size:0}.logo span{font-size:20px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.cards{grid-template-columns:1fr 1fr}.content{padding:14px}}@media(max-width:500px){.cards{grid-template-columns:1fr}.top{padding:0 14px}}
</style></head>
<body><div class="app">
<aside class="side"><div class="logo"><span>●</span> МойБизнес</div><nav class="nav">
<button data-page="home">⌂ Главная</button><button data-page="sales">▣ Продажи</button><button data-page="purchases">▤ Покупки</button><button data-page="stock">▥ Склад</button><button data-page="counterparties">♙ Контрагенты</button><button data-page="cash">₽ Касса</button><button data-page="reports">◫ Отчёты</button>
</nav></aside>
<main class="main"><header class="top"><strong id="title">Главная</strong><span class="user">Администратор</span></header><section class="content" id="content"></section></main></div>
<script>
const titles={home:"Главная",sales:"Продажи",purchases:"Покупки",stock:"Склад",counterparties:"Контрагенты",cash:"Касса",reports:"Отчёты"};
const defaults={sales:[],purchases:[],stock:[{name:"Товар 1",qty:10,price:1500},{name:"Товар 2",qty:25,price:800}],counterparties:[],cash:[]};
let db;
try{db=JSON.parse(localStorage.getItem("mybusiness-data-v2")||"null")}catch(e){db=null}
if(!db||typeof db!=="object")db=JSON.parse(JSON.stringify(defaults));
for(const k of Object.keys(defaults))if(!Array.isArray(db[k]))db[k]=defaults[k];
function save(){localStorage.setItem("mybusiness-data-v2",JSON.stringify(db))}
function money(n){return new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB"}).format(Number(n)||0)}
function table(head,rows){if(!rows.length)return '<div class="empty">Нет данных. Создайте первый документ.</div>';return '<table class="table"><thead><tr>'+head.map(x=>"<th>"+x+"</th>").join("")+'</tr></thead><tbody>'+rows.map(r=>"<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}
function render(page){
document.querySelector("#title").textContent=titles[page]||"Главная";
document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
const c=document.querySelector("#content");
if(page==="home"){
const sales=db.sales.reduce((s,x)=>s+Number(x.sum||0),0),purchases=db.purchases.reduce((s,x)=>s+Number(x.sum||0),0),qty=db.stock.reduce((s,x)=>s+Number(x.qty||0),0),cash=db.cash.reduce((s,x)=>s+Number(x.amount||0),0);
c.innerHTML='<div class="cards"><div class="card"><small>Продажи</small><b>'+money(sales)+'</b></div><div class="card"><small>Покупки</small><b>'+money(purchases)+'</b></div><div class="card"><small>Товаров на складе</small><b>'+qty+'</b></div><div class="card"><small>Касса</small><b>'+money(cash)+'</b></div></div><div class="toolbar"><button class="btn primary" id="quickSale">Новая продажа</button><button class="btn" id="quickClient">Добавить контрагента</button></div><div class="card"><h3>Мини-ERP</h3><p>Браузерный прототип учёта в стиле классических систем 1С. Данные сохраняются локально в этом браузере.</p></div>';
document.querySelector("#quickSale").onclick=()=>addDoc("sales");document.querySelector("#quickClient").onclick=addClient;
}else if(page==="sales"||page==="purchases"){
c.innerHTML='<div class="toolbar"><button class="btn primary" id="add">+ Новый документ</button></div>'+table(["№","Дата","Контрагент","Сумма"],db[page].map((x,i)=>[i+1,x.date,x.client,money(x.sum)]));document.querySelector("#add").onclick=()=>addDoc(page);
}else if(page==="stock"){
c.innerHTML='<div class="toolbar"><button class="btn primary" id="add">+ Приход товара</button></div>'+table(["Товар","Количество","Цена","Сумма"],db.stock.map(x=>[x.name,x.qty,money(x.price),money(x.qty*x.price)]));document.querySelector("#add").onclick=addStock;
}else if(page==="counterparties"){
c.innerHTML='<div class="toolbar"><button class="btn primary" id="add">+ Контрагент</button></div>'+table(["Название","ИНН","Телефон"],db.counterparties.map(x=>[x.name,x.inn,x.phone]));document.querySelector("#add").onclick=addClient;
}else if(page==="cash"){
c.innerHTML='<div class="toolbar"><button class="btn primary" id="add">+ Операция</button></div>'+table(["Дата","Тип","Сумма","Комментарий"],db.cash.map(x=>[x.date,x.type,money(x.amount),x.comment]));document.querySelector("#add").onclick=addCash;
}else if(page==="reports"){
const s=db.sales.reduce((a,x)=>a+Number(x.sum||0),0),p=db.purchases.reduce((a,x)=>a+Number(x.sum||0),0);
c.innerHTML='<div class="cards"><div class="card"><small>Выручка</small><b>'+money(s)+'</b></div><div class="card"><small>Затраты</small><b>'+money(p)+'</b></div><div class="card"><small>Результат</small><b>'+money(s-p)+'</b></div></div><div class="card" style="margin-top:16px"><h3>Сводка</h3><p>Продаж: '+db.sales.length+' · Покупок: '+db.purchases.length+' · Контрагентов: '+db.counterparties.length+'</p></div>';
}}
function addDoc(type){const client=prompt("Контрагент:","ООО Ромашка");if(client===null)return;const sum=Number(prompt("Сумма:","10000"));if(!Number.isFinite(sum))return;db[type].push({date:new Date().toLocaleDateString("ru-RU"),client,sum});save();render(type)}
function addStock(){const name=prompt("Название товара:");if(!name)return;const qty=Number(prompt("Количество:","1")),price=Number(prompt("Цена:","1000"));if(!Number.isFinite(qty)||!Number.isFinite(price))return;db.stock.push({name,qty,price});save();render("stock")}
function addClient(){const name=prompt("Название:");if(!name)return;db.counterparties.push({name,inn:prompt("ИНН:","")||"",phone:prompt("Телефон:","")||""});save();render("counterparties")}
function addCash(){const type=prompt("Тип операции (Приход/Расход):","Приход");if(type===null)return;const amount=Number(prompt("Сумма:","1000"));if(!Number.isFinite(amount))return;db.cash.push({date:new Date().toLocaleDateString("ru-RU"),type,amount:type.toLowerCase().startsWith("рас")?-Math.abs(amount):Math.abs(amount),comment:prompt("Комментарий:","")||""});save();render("cash")}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.page)));
render("home");
</script></body></html>
